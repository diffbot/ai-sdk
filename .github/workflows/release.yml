name: Release

# Only a `v*` tag publishes. workflow_dispatch exists so the whole pipeline can
# be rehearsed without releasing: it runs the verify job (lint, typecheck,
# tests, build, `pnpm pack`) and nothing else. Every step that publishes to npm
# or creates a GitHub release is gated on a real tag push, so a dispatch — on
# any branch, by anyone with write access — can never ship a version.
#
# npm auth is trusted publishing (OIDC). No NPM_TOKEN and no GitHub environment.
# The package must already exist on npm before a trusted publisher can be added.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify (lint, typecheck, test, build, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Dry run of the artifact itself: pack the tarball and list it, so the
      # `files` field is proven to ship `dist/` + README + LICENSE and nothing
      # else. Works while the package is still `"private": true` — and so does
      # `pnpm publish --dry-run`, since npm's EPRIVATE check doesn't fire in
      # dry-run mode; that would be the stronger rehearsal, exercising the real
      # packing and registry-resolution path rather than just the tarball.
      - name: pnpm pack
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/*.tgz

  # Cheap pre-flight checks: a mistyped tag or an unflipped `private` flag is
  # reported within seconds instead of at the end of a release. This job runs in
  # parallel with `verify` rather than ahead of it, so it does not cut `verify`
  # short — `publish` needs both.
  guards:
    name: tag and manifest guards
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $version."
      - name: package.json must not be private
        run: |
          if [ "$(node -p "String(require('./package.json').private === true)")" = "true" ]; then
            echo '::error::package.json still has "private": true — set it to false before tagging a release (PLAN.md §7.4 step 0c).'
            exit 1
          fi

  publish:
    name: publish to npm
    needs: [guards, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships older. Use npm,
      # not pnpm, so the OIDC token exchange works. No token is set.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      # The dist-tag is derived from the version, not from the tag name: a
      # prerelease (anything containing a `-`, e.g. 0.1.0-rc.1) publishes as
      # `next` so a plain `npm install @diffbot/ai-sdk` keeps resolving to the
      # last stable release. The guards above already proved the git tag equals
      # this version.
      - name: Publish to npm
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping publish."
            exit 0
          fi
          echo "Publishing $version with --tag $dist_tag (npm trusted publishing)."
          # --ignore-scripts: dist/ was built above. No NODE_AUTH_TOKEN; npm
          # authenticates with the trusted publisher on npmjs.com.
          npm publish --access public --provenance --ignore-scripts --tag "$dist_tag"

      # A final release also moves `next`, so `next` is never behind `latest`.
      # Uses npm trusted publishing (OIDC) for `npm dist-tag`, which needs npm
      # >= 11.21.0 / 12.2.0 and "Allow npm dist-tag" enabled on this package's
      # trusted publisher at npmjs.com (off by default). The version is already
      # published at this point, so a failure only warns and never fails the run.
      - name: Point next at final release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -uo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*) echo "Prerelease ${version}: next was set by publish."; exit 0 ;;
          esac
          if npm dist-tag add "${name}@${version}" next; then
            echo "next -> ${name}@${version}"
          else
            echo "::warning::Could not point next at ${name}@${version}. Enable 'Allow npm dist-tag' on the trusted publisher for ${name} at npmjs.com, or run: npm dist-tag add ${name}@${version} next"
          fi

  github-release:
    name: create GitHub release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that writes to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
