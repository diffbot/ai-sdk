name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: unit tests (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  peer-matrix:
    # Both supported pairs, against the same source: ai@6 + @ai-sdk/openai-compatible@2
    # and ai@7 + @3. The pairing itself lives in the `test:peer:*` scripts in
    # package.json so the same leg can be reproduced locally.
    name: peer matrix (${{ matrix.peer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        peer: [ai6, ai7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:peer:${{ matrix.peer }}

  live-skip-guard:
    name: live suite skip guard (empty token)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: DIFFBOT_API_TOKEN="" pnpm test:live

  workers:
    # Keeps the package edge-clean: wrangler bundles the fixture for workerd
    # with no compatibility flags, then the paired scan rejects any static
    # Node builtin import that reached the bundle, prefixed (`node:fs`) or
    # bare (`fs`). No Cloudflare credentials, so this runs on fork PRs like
    # every other job here.
    name: Cloudflare Workers bundle (wrangler --dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workers
